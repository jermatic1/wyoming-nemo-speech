[project]
name = "wyoming-nemo-speech"
version = "0.1.0"
description = "Wyoming ASR and TTS server for NeMo-Speech.cpp"
readme = "README.md"
authors = [
    { name = "Jeremy", email = "155401269+jermatic1@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "cffi>=2.1.1",
    "wyoming>=1.10.2",
]

[project.scripts]
wyoming-nemo-speech = "wyoming_nemo_speech.__main__:run"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["gpu: needs the Vulkan NeMo-Speech library"]
